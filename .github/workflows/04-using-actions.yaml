name: 04 - Using Actions
on:
    push:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Setup node
              uses: actions/setup-node@v6
              with:
                node-version: '20.x'
            - name: Install dependencies
              run: npm ci
